# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v6
      with: 
        path: ~/.m2
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-maven

    - name: Build with Maven
      # Maven Central answers with HTTP 429 under load. Resolver already retries
      # those (retryHandler.serviceUnavailable defaults to "429,503"), but only
      # count=3 at a 5s/10s/15s backoff, so a burst wider than ~30s fails the
      # build -- which is exactly how run 44983978382 died resolving
      # maven-resources-plugin. 6 gives ~105s of cover.
      #
      # Both spellings are set deliberately: Resolver 1.x (Maven 3.9.x, what the
      # runner image ships) reads aether.connector.*, Resolver 2.x (Maven 4)
      # reads aether.transport.*, and each ignores the other's name silently
      # rather than erroring. Do not drop one until the runner's Maven is pinned.
      run: >-
        mvn -B package --file pom.xml
        -Daether.connector.http.retryHandler.count=6
        -Daether.transport.http.retryHandler.count=6

  publish-job:
      runs-on: ubuntu-latest
      needs: [build]
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-java@v6
          with:
            java-version: '25'
            distribution: 'temurin'
            cache: maven
        # Retry flags as in the build job above; see the rationale there.
        - run: >-
            mvn -B package --file pom.xml -DskipTests
            -Daether.connector.http.retryHandler.count=6
            -Daether.transport.http.retryHandler.count=6
        - run: mkdir staging && cp target/*.jar staging
        - uses: actions/upload-artifact@v7
          with:
            name: Package
            path: staging